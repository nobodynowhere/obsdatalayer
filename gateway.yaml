# Local development bootstrap.
#
# This file holds only what cannot be read from the database: how to reach the
# database, where to listen, and listener TLS. Everything else -- instances, tenants,
# timeouts, body limits, log level, reload interval, users and roles -- lives in
# the database and is managed through the admin UI at http://127.0.0.1:9091/ui/
# or the admin API.
#
# On first start the gateway creates an admin account and writes the generated
# password next to the database file.

db:
  type: sqlite
  path: ./gateway.db
  # Optional SQLite tuning:
  # mode: rwc
  # cache: shared
  # pragmas:
  #   busy_timeout: 5000
  #   journal_mode: WAL

# Postgres example:
# db:
#   type: postgres
#   host: postgres.example.com
#   port: 5432
#   database: obsgateway
#   user: obsgateway
#   password: ${OBSGATEWAY_DB_PASSWORD}
#   sslmode: require
#   timezone: UTC
#   connect_timeout: 10

gateway:
  # Listeners accept a bare port, "*:port" for every interface, or "IP:port".
  # A bare port binds every interface for the data plane, and loopback only for
  # the admin plane. Use "*:9091" to expose the admin plane deliberately.
  listen: 8080
  admin_listen: 9091
  # OTLP/gRPC is opt-in. Uncomment to accept OTLP traces, metrics and logs on
  # the conventional gRPC receiver port.
  # otlp_grpc_listen: "*:4317"

  # Upstream backend credentials are encrypted at rest with this key. It lives
  # outside the database on purpose: a key stored beside the ciphertext would
  # protect nothing, and the point is that a database backup is not enough to
  # read the credentials.
  #
  # Generate one with:
  #   obsgateway --generate-encryption-key --encryption-key-file /etc/obsgateway/enc.key
  #
  # The file must not be readable by group or others (mode 0600). Back it up:
  # without it the stored credentials cannot be recovered.
  #
  # OBSGATEWAY_ENCRYPTION_KEY overrides this path, carrying the base64 key
  # directly, which suits containers that inject it from a secret store.
  #
  # The gateway refuses to start if credentials are stored and no key is
  # configured. A fresh install with no credentials starts without one.
  # encryption_key_file: /etc/obsgateway/enc.key
  tls:
    enabled: false
    # Generate a local test certificate:
    # obsgateway -config gateway.yaml --generate-self-signed --self-signed-hosts localhost,127.0.0.1 --update-config
    # By default this writes obsgateway.crt and obsgateway.key in /etc/obsgateway.
    # Use --self-signed-dir . to write them in the working directory instead.
    cert_file: /etc/obsgateway/obsgateway.crt
    key_file: /etc/obsgateway/obsgateway.key
    min_version: TLS1.2
    cipher_suites:
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
