# Bootstrap configuration for obsgateway.
#
# Only the database connection and the listener addresses live here. All runtime
# configuration -- instances, tenants, timeouts, body limits, log level, reload
# interval, users and roles -- is stored in the database and managed through the
# admin UI or the admin API on the admin listener.
#
# On first start the gateway creates an admin account and writes the generated
# password to /var/lib/obsgateway/.obsgateway-admin-password.

db:
  type: sqlite
  dsn: /var/lib/obsgateway/gateway.db

gateway:
  # Listeners accept a bare port, "*:port" for every interface, or "IP:port".
  # The data plane serves clients, so a bare port binds every interface.
  listen: 8080
  # The admin plane carries config, user, role and tenant management. A bare
  # port binds loopback only; set "*:9091" to expose it, and firewall it.
  admin_listen: 9091
